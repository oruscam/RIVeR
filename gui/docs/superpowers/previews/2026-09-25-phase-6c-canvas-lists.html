<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Phase 6c — canvas chrome &amp; lists, three themes</title>
    <!-- The real stylesheets, not copies, so this preview cannot drift from what
         ships. components.css carries .media-container and the panel chrome that
         6c's lists actually sit inside. -->
    <link rel="stylesheet" href="../../../src/index.css" />
    <link rel="stylesheet" href="../../../src/components/components.css" />
    <link rel="stylesheet" href="../../../src/components/CustomIcons/piv-icons.css" />
    <style>
      /* Preview scaffolding only. Everything inside a .panel uses real classes —
         the 6b preview showed primitives without their layout co-classes, and so
         could not have surfaced either geometry defect the final review found.
         Here the rows and chips sit in a real panel box at a realistic width. */
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      .pane {
        background: var(--surface-frame);
        color: var(--text-primary);
        padding: 20px;
        min-height: 100vh;
        border-right: 1px solid var(--border-color);
      }
      .theme-name {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-subdued);
        margin: 0 0 16px;
      }
      .panel {
        background: var(--surface-panel);
        border-radius: var(--radius-lg);
        padding: 14px;
        margin-bottom: 18px;
      }
      .panel h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .sub {
        font-size: 11px;
        color: var(--text-subdued);
        margin: 0 0 10px;
        line-height: 1.5;
      }
      .group-label {
        font-size: 11px;
        color: var(--text-subdued);
        margin: 12px 0 6px;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .row-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Stand-in for the image canvas, at roughly the real aspect ratio. */
      .canvas {
        position: relative;
        aspect-ratio: 16 / 9;
        background:
          repeating-linear-gradient(
            45deg,
            color-mix(in srgb, var(--text-subdued) 8%, transparent) 0 6px,
            transparent 6px 12px
          ),
          var(--surface-field);
        border-radius: var(--radius-md);
        display: grid;
        place-items: center;
        font-size: 11px;
        color: var(--text-subdued);
      }
      .floating-demo {
        position: absolute;
        top: 12px;
        right: 12px;
      }
      .shape-toolbar {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: var(--radius-full);
        background: var(--surface-panel);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.3);
      }
      .mode-pill {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: var(--radius-full);
        background: var(--surface-panel);
        color: var(--text-subdued);
      }
      .verdict {
        font-size: 11px;
        border-left: 2px solid var(--accent-color);
        padding-left: 8px;
        margin: 10px 0 0;
        color: var(--text-subdued);
        line-height: 1.5;
      }
      .bad {
        border-left-color: var(--status-bad);
      }
      /* Technique rows: reserved trailing columns so the toggle column aligns
         across all three rows even though only LSPIV carries export + Median. */
      .tech-rows {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .tech-row {
        display: grid;
        grid-template-columns: 12px 1fr 28px 78px 28px;
        gap: var(--space-2);
        align-items: center;
        min-height: 34px;
        padding: 0 var(--space-2);
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--text-subdued) 6%, transparent);
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .tech-name {
        font-size: var(--text-body);
        font-weight: 600;
      }
      .cell {
        display: flex;
        justify-content: center;
      }
      .cell.median {
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="pane" data-theme="dark"></div>
    <div class="pane" data-theme="light"></div>
    <div class="pane" data-theme="dracula"></div>
    <script>
      const eye = '&#128065;';
      const pencil = '&#9998;';
      const trash = '&#128465;';
      const undo = '&#8630;';
      const tick = '&#10003;';

      const iconBtn = (glyph, title, extra = '') =>
        `<button class="ibtn ibtn-sm ${extra}" title="${title}">${glyph}</button>`;

      const body = (theme) => `
        <p class="theme-name">${theme}</p>

        <!-- ================= A. CROSS SECTIONS ================= -->
        <div class="panel">
          <h3>Cross Sections — sections as chips, masks as rows</h3>
          <p class="sub">
            Sections are single-choice with no per-row controls, so they are chips (spec A1).
            Masks carry eye / edit / delete, so they are list rows. The mask list is no longer
            behind Advanced settings: today MaskCreation renders inside HardModeCrossSections,
            so drawing a mask and then not being able to see it is the default experience.
          </p>

          <p class="group-label">Sections</p>
          <div class="chip-row">
            <button class="chip" aria-selected="true">Section 1</button>
            <button class="chip">Section 2</button>
            <button class="chip">Section 3</button>
            <button class="chip">+ Add section</button>
          </div>

          <p class="group-label">Masks</p>
          <div class="rows">
            <div class="list-row" aria-selected="true">
              <span class="row-label">Mask 1</span>
              ${iconBtn(eye, 'Hide mask')}
              ${iconBtn(pencil, 'Edit mask')}
              ${iconBtn(trash, 'Delete mask', 'ibtn-danger')}
            </div>
            <div class="list-row">
              <span class="row-label">Mask 2</span>
              ${iconBtn(eye, 'Hide mask')}
              ${iconBtn(pencil, 'Edit mask')}
              ${iconBtn(trash, 'Delete mask', 'ibtn-danger')}
            </div>
            <div class="list-row">
              <span class="row-label">Mask 3</span>
              ${iconBtn(eye, 'Show mask', '')}
              ${iconBtn(pencil, 'Edit mask')}
              ${iconBtn(trash, 'Delete mask', 'ibtn-danger')}
            </div>
          </div>
          <div class="chip-row" style="margin-top: 6px">
            <button class="chip chip-sm">+ Add mask</button>
          </div>
          <p class="verdict">
            The <code>[+] Add mask</code> chip here replaces the floating canvas button, so the
            affordance sits next to the list it adds to.
          </p>
          <p class="verdict">
            Masks are <strong>numbered, never named</strong> — no inline rename, no free-text label.
            That also settles the question the spec left open in A1: if no row needs a rename, the
            cross-section row does not either, so nothing in this phase puts a text input inside a
            row. And a numbered label cannot overflow, so the truncation case drawn in the first
            draft of this preview simply does not exist. A hidden mask (row 3) is distinguished by
            the eye control's own state rather than by dimming the label.
          </p>
        </div>

        <!-- ================= B. THE CANVAS ITSELF ================= -->
        <div class="panel">
          <h3>The canvas — before</h3>
          <div class="canvas">
            <span>image canvas</span>
            <div class="floating-demo">${iconBtn(pencil, 'Add mask')}</div>
          </div>
          <p class="verdict bad">
            Today: an inline <code>position:absolute; top:12px; right:12px</code> wrapper at
            CrossSections.tsx:68 floats the add-mask control over the footage, and Processing.tsx:152
            does the same for the MP4 export at <code>z-index:1000</code>. The spec attributes the
            first to AddMaskButton.tsx; it is actually at the call site.
          </p>

          <h3 style="margin-top: 14px">The canvas — after</h3>
          <div class="canvas">
            <span>image canvas</span>
            <div class="mode-pill">Click to place a point</div>
            <div class="shape-toolbar">
              ${iconBtn(undo, 'Undo point')}
              ${iconBtn(trash, 'Delete region', 'ibtn-danger')}
              ${iconBtn(tick, 'Done')}
            </div>
          </div>
          <p class="verdict">
            Only two things may sit over footage: the mode-hint pill and the per-shape toolbar.
            Regions get the same Done / Undo point / Delete toolbar masks already have — today
            StabilizationCanvas.tsx:417 gives them one green tick and no way to undo a point.
          </p>
        </div>

        <!-- ================= C. VIDEO RANGE ================= -->
        <div class="panel">
          <h3>Video Range — numbered stabilisation regions</h3>
          <p class="sub">
            Leaves the <code>extraFields &amp;&amp;</code> gate at FormVideo.tsx:227 and stays
            visible whenever stabilisation is on.
          </p>
          <div class="rows">
            <div class="list-row" aria-selected="true">
              <span class="row-label">Region 1</span>
              ${iconBtn(pencil, 'Edit region')}
              ${iconBtn(trash, 'Delete region', 'ibtn-danger')}
            </div>
            <div class="list-row">
              <span class="row-label">Region 2</span>
              ${iconBtn(pencil, 'Edit region')}
              ${iconBtn(trash, 'Delete region', 'ibtn-danger')}
            </div>
          </div>
          <div class="chip-row" style="margin-top: 6px">
            <button class="chip chip-sm">+ Add region</button>
          </div>
          <p class="verdict">
            A region is editable, exactly as a mask is. They are different objects — a region has no
            visibility toggle, so it takes edit and delete where a mask takes eye, edit and delete —
            but "I drew this shape and now I want to adjust it" is the same need, and there is no
            reason one shape type answers it and the other does not.
          </p>
          <p class="verdict">
            This is why the canvas toolbar above matters rather than being cosmetic: Edit is what
            puts a region back into point-placing mode, and that mode needs Undo point and Delete to
            be usable. Today a region gets a single green tick and no way back, so editing one is not
            merely missing from the list — there is nowhere for it to land.
          </p>
          <p class="verdict">
            Labels follow the mask convention: <code>Region 1</code>, not <code>1 — Region</code>.
            One numbering style for every user-created object in the app.
          </p>
        </div>

        <!-- ================= D. PROCESSING / EXPORT ================= -->
        <div class="panel">
          <h3>Processing — technique rows, toggles aligned</h3>
          <p class="sub">
            Approved direction: the export icon lives in the LSPIV row, not in an action row of its
            own. Each technique's name sits in the same row as its toggle. LSPIV's toggle is on by
            default and cannot be turned off. To the left of the toggle sits Median; to the left of
            that, export video — both LSPIV-only.
          </p>

          <div class="tech-rows">
            <div class="tech-row">
              <span class="swatch" style="background: var(--tech-lspiv)"></span>
              <span class="tech-name" style="color: var(--tech-lspiv)">LSPIV</span>
              <span class="cell">
                <button class="ibtn ibtn-sm" title="Export MP4">&#11123;</button>
              </span>
              <span class="cell median">
                <button class="chip chip-sm" aria-pressed="true">Median</button>
              </span>
              <span class="cell">
                <button
                  class="ibtn ibtn-sm"
                  aria-pressed="true"
                  aria-disabled="true"
                  title="LSPIV is always computed and cannot be turned off"
                >
                  &#10003;
                </button>
              </span>
            </div>

            <div class="tech-row">
              <span class="swatch" style="background: var(--tech-stiv)"></span>
              <span class="tech-name">STIV</span>
              <span class="cell"></span>
              <span class="cell median"></span>
              <span class="cell">
                <button class="ibtn ibtn-sm" aria-pressed="true" title="STIV is on">&#10003;</button>
              </span>
            </div>

            <div class="tech-row">
              <span class="swatch" style="background: var(--tech-iwave)"></span>
              <span class="tech-name">iWave</span>
              <span class="cell"></span>
              <span class="cell median"></span>
              <span class="cell">
                <button class="ibtn ibtn-sm" title="iWave is off">&#10005;</button>
              </span>
            </div>
          </div>

          <p class="verdict">
            The toggles align because the trailing controls sit in <strong>reserved grid
            columns</strong>, not in a flex run. STIV and iWave leave the export and Median cells
            empty rather than closing the gap — with plain flex their toggles would slide left by the
            width of two controls and the column would not exist. The Median cell is a fixed width
            for the same reason: a text label's width varies once translated.
          </p>
          <p class="verdict bad">
            Two things this direction fixes that are defects today, not just layout. The whole row is
            currently the click target, so the Median button needs
            <code>event.stopPropagation()</code> to avoid also switching the preview — an explicit
            toggle removes that. And the Results legend's eye control uses a native
            <code>disabled</code> attribute together with a title explaining why it cannot be
            toggled, so Chromium suppresses exactly the tooltip that carries the explanation. The
            LSPIV toggle above is <code>aria-disabled</code> instead — hover it and the reason
            appears.
          </p>
          <p class="verdict">
            Scope note: the export's placement is 6c's, but rebuilding these rows is 6d's
            (Processing preview control). Worth deciding which sub-plan takes it rather than letting
            it fall between them.
          </p>
        </div>
      `;
      document.querySelectorAll('.pane').forEach((pane) => {
        pane.innerHTML = body(pane.dataset.theme);
      });
    </script>
  </body>
</html>
