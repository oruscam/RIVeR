<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loaders — options, three themes</title>
    <!-- The real stylesheet, for the theme tokens and the current .loader-* rules.
         Everything under "PROPOSED" is new and lives only in this preview. -->
    <link rel="stylesheet" href="../../../src/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        background: #000;
      }
      .pane {
        background: var(--surface-frame);
        color: var(--text-primary);
        padding: 20px;
        min-height: 100vh;
        border-right: 1px solid var(--border-color);
      }
      .theme-name {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-subdued);
        margin: 0 0 16px;
      }
      .group-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15px;
        margin: 28px 0 10px;
      }
      .panel {
        background: var(--surface-panel);
        border-radius: var(--radius-lg);
        padding: 14px;
        margin-bottom: 14px;
      }
      .panel h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 2px;
      }
      .sub {
        font-size: 12px;
        color: var(--text-subdued);
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .stage {
        height: 230px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px dashed var(--border-color);
        border-radius: var(--radius-md);
        position: relative;
        overflow: hidden;
      }
      .stage.short { height: 120px; }
      .stage p { margin: 0; }

      /* -------- CURRENT (reproduced with the real classes, scaled to fit) -------- */
      .current .loader-wrapper-big { transform: scale(0.8); }
      .current .meta { font-size: 13px; color: var(--text-subdued); margin-top: 4px; }
      .current .loader-remaining-time { font-size: 18px !important; margin-top: 4px; }

      /* =====================================================================
         PROPOSED
         ===================================================================== */
      .num {
        font-family: var(--font-display);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      .muted { color: var(--text-subdued); }
      .label {
        font-size: var(--text-meta);
        color: var(--text-subdued);
      }

      /* A — thin ring */
      .ring { position: relative; width: 112px; height: 112px; }
      .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
      .ring .track { stroke: var(--readout-border); }
      .ring .fill {
        stroke: var(--accent-color);
        stroke-linecap: round;
        transition: stroke-dashoffset 400ms var(--motion-ease), opacity var(--motion-base);
      }
      .ring .indet {
        stroke: var(--accent-color);
        stroke-linecap: round;
        transform-origin: 50% 50%;
        animation: rot 1.1s linear infinite;
        transition: opacity var(--motion-base);
      }
      .ring .center {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px;
      }
      .a-stage-line { margin-top: 14px; font-size: var(--text-body); font-weight: 600; }
      .a-time { margin-top: 4px; }

      /* B — segmented line */
      .seg-wrap { width: 86%; }
      .seg-head {
        display: flex; align-items: baseline; justify-content: space-between;
        margin-bottom: 10px;
      }
      .seg-head .num { font-size: 40px; line-height: 1; }
      .seg-head .stage-name { font-size: var(--text-body); font-weight: 600; text-align: right; }
      .seg-bar { display: flex; gap: 4px; }
      .seg {
        flex: 1; height: 3px; border-radius: 2px;
        background: var(--readout-border);
        position: relative; overflow: hidden;
      }
      .seg i {
        position: absolute; inset: 0; transform: scaleX(0); transform-origin: left;
        background: var(--seg-color, var(--accent-color));
        transition: transform 400ms var(--motion-ease);
      }
      .seg.waiting::after {
        /* indeterminate shimmer on the active segment before its first % */
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 30%;
        background: var(--seg-color, var(--accent-color));
        opacity: 0.6;
        animation: sweep 1.2s var(--motion-ease) infinite;
      }
      .seg-labels { display: flex; gap: 4px; margin-top: 6px; }
      .seg-labels span {
        flex: 1; font-size: var(--text-caption); color: var(--text-subdued);
        transition: color var(--motion-base);
      }
      .seg-labels span.on { color: var(--text-primary); font-weight: 600; }
      .seg-labels span.done { color: var(--text-primary); }
      .seg-foot {
        display: flex; justify-content: space-between; margin-top: 14px;
        font-size: var(--text-meta); color: var(--text-subdued);
        font-variant-numeric: tabular-nums;
      }

      /* C — number only */
      .c-wrap { width: 86%; text-align: left; }
      .c-wrap .num { font-size: 56px; line-height: 1; }
      .c-rule { height: 1px; background: var(--readout-border); margin: 12px 0 8px; position: relative; }
      .c-rule i {
        position: absolute; inset: 0; transform: scaleX(0); transform-origin: left;
        background: var(--text-primary);
        transition: transform 400ms var(--motion-ease);
      }

      /* 1 — thin arc */
      .arc { width: 28px; height: 28px; animation: rot 0.9s linear infinite; }
      .arc circle {
        fill: none; stroke: var(--accent-color); stroke-width: 2; stroke-linecap: round;
        stroke-dasharray: 18 70;
        animation: breathe 1.8s var(--motion-ease) infinite;
      }
      .arc .bg { stroke: var(--readout-border); stroke-dasharray: none; animation: none; }
      .arc.sm { width: 16px; height: 16px; }
      .arc.sm circle { stroke-width: 2.5; }
      .arc.on-accent circle { stroke: var(--on-accent); }
      .arc.on-accent .bg { stroke: rgba(255, 255, 255, 0.25); }
      .tx-label { margin-top: 12px; }

      /* 2 — dots */
      .dots { display: flex; gap: 6px; }
      .dots span {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--text-primary);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }

      /* 3 — top-edge bar */
      .topbar {
        position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden;
      }
      .topbar::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 35%;
        background: var(--accent-color);
        animation: sweep 1.4s var(--motion-ease) infinite;
      }
      .ghost { display: grid; gap: 8px; width: 80%; opacity: 0.5; }
      .ghost div { height: 10px; border-radius: 4px; background: var(--readout-border); }

      /* buttons */
      .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
      .mock-btn {
        display: inline-flex; align-items: center; justify-content: space-between; gap: 12px;
        min-width: 170px; height: 36px; padding: 0 14px;
        border-radius: var(--radius-md); border: 0;
        font: 600 var(--text-body) Inter, sans-serif;
        background: var(--accent-color); color: var(--on-accent);
      }
      .mock-btn.old .loader-little { width: 16px; height: 16px; border-width: 3px; }

      @keyframes rot { to { transform: rotate(360deg); } }
      @keyframes breathe {
        0%, 100% { stroke-dasharray: 10 78; }
        50% { stroke-dasharray: 40 48; }
      }
      @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

      .note {
        font-size: 12px; color: var(--text-subdued); line-height: 1.5;
        border-left: 2px solid var(--accent-color); padding-left: 8px; margin: 10px 0 0;
      }
      .note.bad { border-left-color: var(--background-error); }
      .note.rec { border-left-color: var(--success-color); }
    </style>
  </head>
  <body>
    <div class="pane" data-theme="dark"></div>
    <div class="pane" data-theme="light"></div>
    <div class="pane" data-theme="dracula"></div>

    <template id="tpl">
      <p class="theme-name"></p>

      <div class="group-title">Processing &amp; calibration — measurable progress</div>

      <div class="panel current">
        <h3>Current</h3>
        <p class="sub">Reproduces today’s behaviour: an empty ring first, then the lines appear and the ring jumps up.</p>
        <div class="stage">
          <div class="loader-container-big">
            <div class="loader-wrapper-big">
              <div class="loader-big js-cur-ring"></div>
              <div class="loader-percentage-big js-cur-pct" style="font-size: 22px"></div>
            </div>
            <p class="loader-remaining-time js-cur-time"></p>
          </div>
        </div>
        <p class="note bad">12px stroke, solid text colour, no link between the ring and the real progress, layout shift.</p>
      </div>

      <div class="panel">
        <h3>A · Thin progress ring</h3>
        <p class="sub">The ring <em>is</em> the percentage. Before the first number, a short arc spins on the same track.</p>
        <div class="stage">
          <div class="ring">
            <svg viewBox="0 0 100 100">
              <circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="3" />
              <circle class="indet js-a-indet" cx="50" cy="50" r="44" fill="none" stroke-width="3" stroke-dasharray="50 226.5" />
              <circle class="fill js-a-fill" cx="50" cy="50" r="44" fill="none" stroke-width="3" stroke-dasharray="276.5" stroke-dashoffset="276.5" />
            </svg>
            <div class="center num js-a-pct">–</div>
          </div>
          <p class="a-stage-line js-a-stage">LSPIV</p>
          <p class="a-time label js-time">Estimating time…</p>
        </div>
      </div>

      <div class="panel">
        <h3>B · Segmented line <span class="muted">— recommended</span></h3>
        <p class="sub">One segment per technique in the run, so the bar shows the plan. Segments use your technique colours.</p>
        <div class="stage">
          <div class="seg-wrap">
            <div class="seg-head">
              <span class="num js-b-pct">–</span>
              <span class="stage-name js-b-stage">LSPIV</span>
            </div>
            <div class="seg-bar">
              <div class="seg js-b-seg" style="--seg-color: var(--tech-lspiv)"><i></i></div>
              <div class="seg js-b-seg" style="--seg-color: var(--tech-stiv)"><i></i></div>
              <div class="seg js-b-seg" style="--seg-color: var(--tech-iwave)"><i></i></div>
            </div>
            <div class="seg-labels">
              <span class="js-b-lab">LSPIV</span><span class="js-b-lab">STIV</span><span class="js-b-lab">iWave</span>
            </div>
            <div class="seg-foot">
              <span class="js-b-station">Station –</span>
              <span class="js-time">Estimating time…</span>
            </div>
          </div>
        </div>
        <p class="note rec">Fixed layout from the first frame. The same component with one accent segment covers calibration ↓</p>
      </div>

      <div class="panel">
        <h3>B · Calibration (single segment)</h3>
        <p class="sub">Same component, one segment, accent colour.</p>
        <div class="stage">
          <div class="seg-wrap">
            <div class="seg-head">
              <span class="num js-cal-pct">–</span>
              <span class="stage-name">Solving calibration</span>
            </div>
            <div class="seg-bar">
              <div class="seg js-cal-seg"><i></i></div>
            </div>
            <div class="seg-foot">
              <span>24 photos</span>
              <span class="js-cal-time">Estimating time…</span>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>C · Number only</h3>
        <p class="sub">The most minimal option: a large figure and a hairline.</p>
        <div class="stage">
          <div class="c-wrap">
            <span class="num js-c-pct">–</span>
            <div class="c-rule"><i class="js-c-fill"></i></div>
            <div class="seg-foot" style="margin-top: 0">
              <span class="js-c-stage">LSPIV</span>
              <span class="js-time">Estimating time…</span>
            </div>
          </div>
        </div>
        <p class="note">Before the first % arrives there is very little on screen.</p>
      </div>

      <div class="group-title">Between modules — no percentage</div>

      <div class="panel">
        <h3>Current</h3>
        <div class="stage short"><div class="loader-mid" style="width: 48px; height: 48px; border-width: 6px"></div></div>
      </div>

      <div class="panel">
        <h3>1 · Thin arc <span class="muted">— recommended</span></h3>
        <p class="sub">2px, accent, breathing arc. In the app it only appears after ~250ms, so fast switches never flash.</p>
        <div class="stage short">
          <svg class="arc" viewBox="0 0 32 32"><circle class="bg" cx="16" cy="16" r="14" /><circle cx="16" cy="16" r="14" /></svg>
          <p class="tx-label label">Loading project…</p>
        </div>
      </div>

      <div class="panel">
        <h3>2 · Three-dot pulse</h3>
        <div class="stage short"><div class="dots"><span></span><span></span><span></span></div></div>
        <p class="note">Softer, but reads more chat app than scientific tool.</p>
      </div>

      <div class="panel">
        <h3>3 · Top-edge bar</h3>
        <div class="stage short">
          <div class="topbar"></div>
          <div class="ghost"><div></div><div style="width: 70%"></div><div style="width: 85%"></div></div>
        </div>
        <p class="note">Most discreet; easy to miss on a large screen.</p>
      </div>

      <div class="group-title">Inside buttons</div>
      <div class="panel">
        <div class="btn-row">
          <button class="mock-btn old">Current <span class="loader-little"></span></button>
          <button class="mock-btn">
            Analyzing
            <svg class="arc sm on-accent" viewBox="0 0 32 32"><circle class="bg" cx="16" cy="16" r="13" /><circle cx="16" cy="16" r="13" /></svg>
          </button>
        </div>
        <p class="note rec">The thin arc at 16px replaces the button spinner: one spinner design across the app.</p>
      </div>
    </template>

    <script>
      const names = { dark: 'Dark', light: 'Light', dracula: 'Dracula' };
      const tpl = document.getElementById('tpl');
      document.querySelectorAll('.pane').forEach((pane) => {
        pane.appendChild(tpl.content.cloneNode(true));
        pane.querySelector('.theme-name').textContent = names[pane.dataset.theme];
      });

      const $$ = (sel) => document.querySelectorAll(sel);
      const set = (sel, fn) => $$(sel).forEach(fn);

      // Simulated run: estimating, then LSPIV, STIV, iWave, then a short "done" hold.
      const STAGES = [
        { key: 'LSPIV', len: 4400, stations: 0 },
        { key: 'STIV', len: 3600, stations: 21 },
        { key: 'iWave', len: 3200, stations: 0 },
      ];
      const ESTIMATE = 1600, HOLD = 2200;
      const TOTAL = ESTIMATE + STAGES.reduce((s, x) => s + x.len, 0) + HOLD;
      const CIRC = 276.5;
      const fmt = (ms) => {
        const s = Math.max(0, Math.round(ms / 1000));
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      };

      let start = performance.now(), lastPct = null;
      function frame(now) {
        let t = (now - start) % TOTAL;

        let idx = 0, pct = null, done = false, remaining = null;
        if (t < ESTIMATE) {
          pct = null;
        } else {
          let u = t - ESTIMATE;
          idx = 0;
          while (idx < STAGES.length && u >= STAGES[idx].len) { u -= STAGES[idx].len; idx++; }
          if (idx >= STAGES.length) { idx = STAGES.length - 1; pct = 100; done = true; remaining = 0; }
          else {
            // Each stage reports its first % ~300ms in, mirroring the real backend.
            pct = u < 300 && idx > 0 ? null : Math.min(100, Math.floor((u / STAGES[idx].len) * 100));
            remaining = STAGES[idx].len - u;
          }
        }
        const stage = STAGES[idx];
        const pctTxt = pct === null ? '–' : `${pct}%`;
        const timeTxt = pct === null ? 'Estimating time…' : done ? 'Done' : `Remaining ${fmt(remaining * 10)}`;

        // Current: only shows the % and time once a % exists, so the column re-centres.
        set('.js-cur-pct', (e) => (e.textContent = pct === null ? '' : `${pct}%`));
        set('.js-cur-time', (e) => (e.textContent = pct === null ? '' : timeTxt));
        set('.js-cur-ring', (e) => e.classList.toggle('loader-complete-big', done));

        // A
        set('.js-a-pct', (e) => { e.textContent = pctTxt; e.classList.toggle('muted', pct === null); });
        set('.js-a-fill', (e) => {
          e.style.strokeDashoffset = pct === null ? CIRC : CIRC * (1 - pct / 100);
          e.style.opacity = pct === null ? 0 : 1;
          // Snap back without easing when a new stage starts.
          e.style.transition = lastPct !== null && pct !== null && pct < lastPct ? 'none' : '';
        });
        set('.js-a-indet', (e) => (e.style.opacity = pct === null ? 1 : 0));
        set('.js-a-stage', (e) => (e.textContent = stage.key));
        set('.js-time', (e) => (e.textContent = timeTxt));

        // B
        set('.js-b-pct', (e) => { e.textContent = pctTxt; e.classList.toggle('muted', pct === null); });
        set('.js-b-stage', (e) => (e.textContent = done ? 'Complete' : stage.key));
        $$('.pane').forEach((pane) => {
          pane.querySelectorAll('.js-b-seg').forEach((seg, i) => {
            const w = i < idx ? 100 : i === idx ? (pct ?? 0) : 0;
            seg.querySelector('i').style.transform = `scaleX(${w / 100})`;
            seg.classList.toggle('waiting', i === idx && pct === null);
          });
          pane.querySelectorAll('.js-b-lab').forEach((lab, i) => {
            lab.classList.toggle('on', i === idx && !done);
            lab.classList.toggle('done', i < idx || done);
          });
        });
        set('.js-b-station', (e) => {
          e.textContent =
            stage.stations && pct !== null ? `Station ${Math.max(1, Math.ceil((pct / 100) * stage.stations))} / ${stage.stations}` : '';
        });

        // Calibration: one stage across the whole run length.
        const runLen = TOTAL - HOLD - ESTIMATE;
        const calPct = t < ESTIMATE ? null : Math.min(100, Math.floor(((t - ESTIMATE) / runLen) * 100));
        set('.js-cal-pct', (e) => { e.textContent = calPct === null ? '–' : `${calPct}%`; e.classList.toggle('muted', calPct === null); });
        set('.js-cal-seg', (e) => { e.querySelector('i').style.transform = `scaleX(${(calPct ?? 0) / 100})`; e.classList.toggle('waiting', calPct === null); });
        set('.js-cal-time', (e) => {
          e.textContent = calPct === null ? 'Estimating time…' : calPct >= 100 ? 'Done' : `Remaining ${fmt((runLen - (t - ESTIMATE)) * 10)}`;
        });

        // C
        set('.js-c-pct', (e) => { e.textContent = pctTxt; e.classList.toggle('muted', pct === null); });
        set('.js-c-fill', (e) => { e.style.transform = `scaleX(${(pct ?? 0) / 100})`; e.style.transition = lastPct !== null && pct !== null && pct < lastPct ? 'none' : ''; });
        set('.js-c-stage', (e) => (e.textContent = done ? 'Complete' : stage.key));

        lastPct = pct;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
