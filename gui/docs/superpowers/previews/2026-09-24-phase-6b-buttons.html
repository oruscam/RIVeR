<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Phase 6b — button sizes, three themes</title>
    <!-- Links the real stylesheet rather than copying rules, so this preview
         cannot drift from what ships. -->
    <link rel="stylesheet" href="../../../src/index.css" />
    <!-- .ib used to live here; Task 10 deleted it (see the inlined
         .before-legacy rules below). This link stays for .ibtn's neighbours
         (.cl, the wiggle keyframes) and so the "after" row keeps matching
         what ships. -->
    <link rel="stylesheet" href="../../../src/components/CustomIcons/piv-icons.css" />
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      .pane {
        background: var(--surface-panel);
        color: var(--text-primary);
        padding: 24px;
        min-height: 100vh;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-subdued);
        margin: 0 0 4px;
      }
      h3 {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-subdued);
        margin: 20px 0 8px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .note {
        font-size: 11px;
        color: var(--text-subdued);
        margin: 0 0 12px;
        line-height: 1.5;
      }

      /* Task 10 (2026-09-25) deleted .wizard-button(-active), .button-1,
         .danger-button from src/index.css and .ib, .ib.is-success, .ib:active,
         .ib.active, .ib-danger, .ib-danger:hover from piv-icons.css — they had
         zero remaining consumers once Tasks 1-9 migrated every call site. The
         two <link>s above no longer style the "before" row at all, so its
         declarations are inlined here (copied verbatim from git history at
         54df396) purely so this comparison keeps rendering. This is dead CSS
         kept alive only for this preview; it must never be copied back into a
         real stylesheet. */
      .before-legacy .danger-button {
        min-width: 165px;
        height: auto;
        min-height: 50px;
        background-color: var(--background-error);
        border: 2px solid;
        border-radius: 20px;
        font-size: 18px;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: transform 0.1s;
      }
      .before-legacy .danger-button:hover {
        color: var(--inverse-text);
      }
      .before-legacy .danger-button:active {
        transform: translateY(4px);
      }
      .before-legacy .button-1 {
        width: 232px;
        height: 50px;
        background-color: var(--background-color);
        border: 2px solid;
        border-color: var(--primary-text-color);
        color: var(--primary-text-color);
        border-radius: 20px;
        font-size: 20px;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background-color 0.1s, color 0.1s, transform 0.1s;
      }
      .before-legacy .button-1:hover {
        background-color: var(--primary-text-color);
        color: var(--background-color);
      }
      .before-legacy .button-1:active {
        background-color: var(--primary-text-color);
        color: var(--background-color);
        transform: translateY(4px);
      }
      .before-legacy .wizard-button {
        width: 132px;
        height: auto;
        min-height: 50px;
        background-color: var(--background-color);
        border: 2px solid;
        border-color: var(--primary-text-color);
        color: var(--primary-text-color);
        border-radius: 20px;
        font-size: 20px;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background-color 0.1s, color 0.1s, transform 0.1s;
        cursor: pointer;
        padding: 3px;
      }
      .before-legacy .wizard-button:hover:not(:disabled) {
        background-color: var(--inverse-bg);
        color: var(--inverse-text);
      }
      .before-legacy .wizard-button:active {
        background-color: var(--inverse-bg);
        color: var(--inverse-text);
        transform: translateY(4px);
      }
      .before-legacy .wizard-button-active {
        background-color: var(--inverse-bg);
        color: var(--inverse-text);
        transform: translateY(4px);
      }
      .before-legacy .ib {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 45px;
        height: 45px;
        border-radius: 8px;
        border: 2px solid var(--primary-text-color, #fff);
        background: transparent;
        cursor: pointer;
        overflow: hidden;
        user-select: none;
        flex-shrink: 0;
        transition: background-color 0.2s, color 0.2s, transform 0.1s;
        outline: none;
        color: var(--primary-text-color, #fff);
      }
      .before-legacy .ib.is-success {
        color: var(--success-color);
        border-color: var(--success-color);
        background-color: var(--primary-text-color);
      }
      .before-legacy .ib:active {
        transform: scale(0.92);
      }
      .before-legacy .ib.active {
        background: var(--primary-text-color, #fff);
        color: var(--secondary-background-color, #000);
      }
      .before-legacy .ib-danger {
        transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
      }
      .before-legacy .ib-danger:hover {
        background: var(--background-error, #ED6B57);
        color: #fff;
        border-color: var(--background-error, #ED6B57);
      }
    </style>
  </head>
  <body>
    <div class="pane" data-theme="dark"></div>
    <div class="pane" data-theme="light"></div>
    <div class="pane" data-theme="dracula"></div>
    <script>
      const body = (theme) => `
        <h2>${theme}</h2>

        <h3>before — legacy (50px tall, 20px font, fixed widths)</h3>
        <div class="row before-legacy">
          <button class="wizard-button">Draw line</button>
          <button class="wizard-button wizard-button-active">Draw line</button>
          <button class="button-1">New project</button>
          <button class="danger-button">Stop</button>
        </div>

        <h3>after — .btn-lg (48px, 16px) · the proposed size</h3>
        <div class="row">
          <button class="btn btn-lg btn-secondary">Draw line</button>
          <button class="btn btn-lg btn-secondary" aria-pressed="true">Draw line</button>
          <button class="btn btn-lg btn-secondary" data-complete="true">Import distances</button>
          <button class="btn btn-lg btn-primary">New project</button>
          <button class="btn btn-lg btn-danger">Stop</button>
          <button class="btn btn-lg btn-tertiary">Back</button>
          <button class="btn btn-lg btn-secondary" disabled>Unavailable</button>
        </div>

        <h3>after — .btn (40px, 14px), the audit's own size, for comparison</h3>
        <div class="row">
          <button class="btn btn-secondary">Draw line</button>
          <button class="btn btn-secondary" aria-pressed="true">Draw line</button>
          <button class="btn btn-primary">New project</button>
          <button class="btn btn-danger">Stop</button>
        </div>

        <h3>a state on an already-filled variant is a ring, not a fill</h3>
        <p class="note">
          A fill-based pressed state is invisible on .btn-primary (its fill already IS the accent
          colour) and would turn a destructive button accent blue. Those two take an inset ring in
          their own on-colour instead. Resting / pressed pairs:
        </p>
        <div class="row">
          <button class="btn btn-lg btn-primary">Analyze</button>
          <button class="btn btn-lg btn-primary" aria-busy="true">Analyze</button>
          <button class="btn btn-lg btn-danger">Stop</button>
          <button class="btn btn-lg btn-danger" aria-pressed="true">Stop</button>
        </div>

        <h3>hover must not repaint a state — hover each pressed button below</h3>
        <p class="note">
          Every hover rule in the family out-specifies the state rules, so without explicit guards
          the accent fill vanishes under the cursor. These should not change colour on hover.
        </p>
        <div class="row">
          <button class="btn btn-lg btn-secondary" aria-pressed="true">secondary pressed</button>
          <button class="btn btn-lg btn-tertiary" aria-pressed="true">tertiary pressed</button>
        </div>

        <h3>icon buttons — .ib (45px, legacy) then .ibtn (32px) and .ibtn-sm (24px)</h3>
        <div class="row before-legacy">
          <button class="ib">&#9654;</button>
          <button class="ib active">&#9654;</button>
          <button class="ib ib-danger">&#128465;</button>
          <button class="ib is-success">&#10003;</button>
        </div>
        <div class="row">
          <button class="ibtn">&#9654;</button>
          <button class="ibtn" aria-pressed="true">&#9654;</button>
          <button class="ibtn" aria-busy="true">&#9654;</button>
          <button class="ibtn ibtn-danger">&#128465;</button>
          <button class="ibtn ibtn-danger" data-armed="true">&#128465;</button>
          <button class="ibtn" data-state="success">&#10003;</button>
          <button class="ibtn" aria-disabled="true" title="Run STIV first">&#9654;</button>
          <button class="ibtn ibtn-sm">&#9654;</button>
        </div>
        <p class="note">
          The last-but-one is aria-disabled, not disabled: hover it and the tooltip must still
          appear. Chromium dispatches no pointer events on a natively disabled control, which is why
          this phase supports both readings.
        </p>
      `;
      document.querySelectorAll('.pane').forEach((pane) => {
        pane.innerHTML = body(pane.dataset.theme);
      });
    </script>
  </body>
</html>
