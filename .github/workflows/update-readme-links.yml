name: Update README download links

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Update download links in readme
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          sed -i \
            -e "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/RIVeR-Windows-[0-9]*\.[0-9]*\.[0-9]*-Setup|releases/download/v${VERSION}/RIVeR-Windows-${VERSION}-Setup|g" \
            -e "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/RIVeR-Mac-[0-9]*\.[0-9]*\.[0-9]*-Installer|releases/download/v${VERSION}/RIVeR-Mac-${VERSION}-Installer|g" \
            -e "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/RIVeR-Linux-[0-9]*\.[0-9]*\.[0-9]*\.deb|releases/download/v${VERSION}/RIVeR-Linux-${VERSION}.deb|g" \
            readme.md

      - name: 3. Commit and push
        run: |
          BRANCH=$(git branch -r --contains ${{ github.sha }} | grep -v HEAD | sed 's|origin/||' | head -1 | xargs)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add readme.md
          git diff --cached --quiet || git commit -m "chore: update download links to ${GITHUB_REF_NAME}"
          git push origin HEAD:$BRANCH
